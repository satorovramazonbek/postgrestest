name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===== CI: har push va pull request'da kodni tekshiradi =====
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgrestest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: postgrestest
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt pytest flake8

      - name: Kod sifatini tekshirish (flake8)
        run: flake8 aaa.py test_aaa.py --max-line-length 140

      - name: Testlar (pytest)
        run: pytest -v

  # ===== CD: testlar o'tsa, main'dagi har push uchun Release chiqaradi =====
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: GitHub Release yaratish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            aaa.py init.sql requirements.txt \
            --title "v1.0.${{ github.run_number }}" \
            --notes "Avtomatik release: ${{ github.sha }}"
